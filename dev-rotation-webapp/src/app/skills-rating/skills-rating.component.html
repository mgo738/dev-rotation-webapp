<h1>Skills Ranking</h1>
<p>I will be ranking my skills on various technologies from 0-10</p>

<div>
  @for (skill of skills; track skill){
    <p>{{ skill.name }}: {{ skill.rating }}/10</p>
    <div>
      <!-- Progress bar for skill rating -->
      <div class="progressBar" >
        <div class="barFilling" [style.width]="ratingToPercentage(skill.rating)" [style.backgroundColor]="fillingColour(skill.rating)"></div>
      </div>
    </div>
  }
</div>
